<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 580" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="6.5" refY="4" orient="auto">
      <path d="M1,1 L6.5,4 L1,7" fill="none" stroke="#1E6E75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="sh" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#1C232B" flood-opacity="0.07"/>
    </filter>
    <style>
      .eyebrow{font-size:12px;font-weight:600;letter-spacing:1.6px;fill:#63707C}
      .title{font-family:Georgia,'Times New Roman',serif;font-size:26px;font-weight:600;fill:#1C232B}
      .subtitle{font-size:14px;fill:#63707C}
      .tag{font-size:10.5px;font-weight:700;letter-spacing:1px}
      .ntitle{font-size:16px;font-weight:600;fill:#1C232B}
      .ndesc{font-size:12.5px;fill:#63707C}
      .raillbl{font-size:12px;fill:#63707C}
      .legword{font-size:14px;font-weight:600;fill:#1C232B}
      .leggloss{font-size:12.5px;fill:#63707C}
      .card{fill:#FFFFFF;stroke:#E6EAEC;stroke-width:1}
      .flow{stroke:#1E6E75;stroke-width:1.6;fill:none}
      .rail{stroke:#1E6E75;stroke-width:1.4;fill:none;stroke-dasharray:2 5;stroke-linecap:round;opacity:.5}
    </style>
  </defs>

  <rect width="1280" height="580" fill="#F5F7F7"/>

  <text class="eyebrow" x="64" y="58">THE WORKFLOW</text>
  <text class="title" x="64" y="94">One workflow, three kinds of work.</text>
  <text class="subtitle" x="64" y="120">Built around a model you already trust, and reconciled back to it.</text>

  <!-- node 1: the model -->
  <g>
    <rect class="card" x="64" y="200" width="195" height="148" rx="10" filter="url(#sh)"/>
    <line x1="76" y1="201" x2="247" y2="201" stroke="#1E6E75" stroke-width="3" stroke-linecap="round"/>
    <circle cx="86" cy="233" r="3.5" fill="#1E6E75"/>
    <text class="tag" x="96" y="237" fill="#1E6E75">SOURCE OF TRUTH</text>
    <text class="ntitle" x="82" y="272">The model</text>
    <text class="ndesc" x="82" y="298">Your workbook, the one</text>
    <text class="ndesc" x="82" y="316">you already trust.</text>
  </g>

  <!-- node 2: validate -->
  <g>
    <rect class="card" x="303" y="200" width="195" height="148" rx="10" filter="url(#sh)"/>
    <line x1="315" y1="201" x2="486" y2="201" stroke="#1E6E75" stroke-width="3" stroke-linecap="round"/>
    <circle cx="325" cy="233" r="3.5" fill="#1E6E75"/>
    <text class="tag" x="335" y="237" fill="#1E6E75">DETERMINISTIC</text>
    <text class="ntitle" x="321" y="272">Validate</text>
    <text class="ndesc" x="321" y="298">Extract and reconcile to</text>
    <text class="ndesc" x="321" y="316">the penny. A hard gate.</text>
  </g>

  <!-- node 3: build -->
  <g>
    <rect class="card" x="542" y="200" width="195" height="148" rx="10" filter="url(#sh)"/>
    <line x1="554" y1="201" x2="725" y2="201" stroke="#5B7C99" stroke-width="3" stroke-linecap="round"/>
    <circle cx="564" cy="233" r="3.5" fill="#5B7C99"/>
    <text class="tag" x="574" y="237" fill="#5B7C99">PROBABILISTIC</text>
    <text class="ntitle" x="560" y="272">Build</text>
    <text class="ndesc" x="560" y="298">Analyse. Exec pack and a</text>
    <text class="ndesc" x="560" y="316">live decision tool.</text>
  </g>

  <!-- node 4: decide -->
  <g>
    <rect class="card" x="781" y="200" width="195" height="148" rx="10" filter="url(#sh)"/>
    <line x1="793" y1="201" x2="964" y2="201" stroke="#B0863A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="803" cy="233" r="3.5" fill="#B0863A"/>
    <text class="tag" x="813" y="237" fill="#B0863A">HUMAN</text>
    <text class="ntitle" x="799" y="272">Decide</text>
    <text class="ndesc" x="799" y="298">Review, pick the scenario,</text>
    <text class="ndesc" x="799" y="316">agree the budget.</text>
  </g>

  <!-- node 5: board pack -->
  <g>
    <rect class="card" x="1020" y="200" width="195" height="148" rx="10" filter="url(#sh)"/>
    <line x1="1032" y1="201" x2="1203" y2="201" stroke="#5B7C99" stroke-width="3" stroke-linecap="round"/>
    <circle cx="1042" cy="233" r="3.5" fill="#5B7C99"/>
    <text class="tag" x="1052" y="237" fill="#5B7C99">PROBABILISTIC</text>
    <text class="ntitle" x="1038" y="272">Board pack</text>
    <text class="ndesc" x="1038" y="298">Board-ready pack, from</text>
    <text class="ndesc" x="1038" y="316">the agreed position.</text>
  </g>

  <!-- flow arrows -->
  <line class="flow" x1="263" y1="274" x2="299" y2="274" marker-end="url(#arw)"/>
  <line class="flow" x1="502" y1="274" x2="538" y2="274" marker-end="url(#arw)"/>
  <line class="flow" x1="741" y1="274" x2="777" y2="274" marker-end="url(#arw)"/>
  <line class="flow" x1="980" y1="274" x2="1016" y2="274" marker-end="url(#arw)"/>

  <!-- reconcile rail: everything ties back to the model -->
  <path class="rail" d="M1117,356 V424 H161 V354" marker-end="url(#arw)"/>
  <text class="raillbl" x="639" y="416" text-anchor="middle">Everything reconciles back to the workbook, to the penny.</text>

  <!-- legend -->
  <text class="eyebrow" x="64" y="470">THE THREE-WAY SPLIT</text>
  <circle cx="69" cy="502" r="5" fill="#1E6E75"/>
  <text class="legword" x="84" y="507">Deterministic</text>
  <text class="leggloss" x="84" y="525">One right answer, the same every time.</text>
  <circle cx="475" cy="502" r="5" fill="#5B7C99"/>
  <text class="legword" x="490" y="507">Probabilistic</text>
  <text class="leggloss" x="490" y="525">Judgement, language, first drafts.</text>
  <circle cx="836" cy="502" r="5" fill="#B0863A"/>
  <text class="legword" x="851" y="507">Human in the loop</text>
  <text class="leggloss" x="851" y="525">The decisions, and the sign-off.</text>
</svg>

<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workforce Budget 2026/27: Board Pack</title>
<style>
:root{color-scheme:light;
  --bg:#f9f9f7;--card:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
  --grid:#e1e0d9;--axis:#c3c2b7;--line:rgba(11,11,11,.10);
  --s1:#2a78d6;--s2:#008300;--s4:#eda100;--s6:#eb6834;--committed:#52514e;
  --warn:#fab219;--crit:#d03b3b;--up:#006300;}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme=light])){
  --bg:#0d0d0d;--card:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--axis:#383835;--line:rgba(255,255,255,.10);
  --s1:#3987e5;--s4:#c98500;--s6:#d95926;--committed:#a8a69c;--up:#0ca30c;}}
:root[data-theme=dark]{--bg:#0d0d0d;--card:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--axis:#383835;--line:rgba(255,255,255,.10);
  --s1:#3987e5;--s4:#c98500;--s6:#d95926;--committed:#a8a69c;--up:#0ca30c;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:56px 72px 72px;max-width:1140px;margin:0 auto;page-break-after:always}
@media (max-width:760px){.slide{padding:34px 22px}}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);font-weight:650;margin-bottom:12px}
h1{font-size:clamp(30px,5vw,50px);line-height:1.08;letter-spacing:-.025em;margin:0 0 16px;font-weight:680}
h2{font-size:clamp(22px,3.1vw,32px);line-height:1.18;letter-spacing:-.02em;margin:0 0 10px;font-weight:670}
.lede{font-size:clamp(15px,1.8vw,18px);color:var(--ink2);max-width:70ch;margin:0 0 24px}
p{max-width:74ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:13px;margin:6px 0 24px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .v{font-size:29px;font-weight:670;letter-spacing:-.025em;margin-top:5px;line-height:1.05}
.kpi .d{font-size:12.5px;color:var(--ink2);margin-top:4px}
.d.pos{color:var(--crit)} .d.neg{color:var(--up)}
table{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums;margin:6px 0 16px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}
th:first-child,td:first-child{text-align:left;font-variant-numeric:normal}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650}
tfoot td{font-weight:670;border-top:2px solid var(--axis);border-bottom:none}
svg{display:block;width:100%;height:auto;overflow:visible;margin:4px 0 10px}
.gl{stroke:var(--grid);stroke-width:1}.ax{stroke:var(--axis);stroke-width:1}
text{fill:var(--ink2);font-size:12px}
text.t{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
text.v{fill:var(--ink);font-size:12px;font-weight:650;font-variant-numeric:tabular-nums}
.callout{border-left:3px solid var(--s1);padding:13px 18px;background:var(--card);border-radius:0 10px 10px 0;margin:14px 0;max-width:78ch}
.callout.warn{border-left-color:var(--warn)}
.callout b{display:block;margin-bottom:4px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
@media (max-width:720px){.cols{grid-template-columns:1fr}}
ul{margin:0 0 14px;padding-left:20px;max-width:74ch}li{margin-bottom:8px}
.flag{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:0 10px 10px 0;padding:12px 16px;margin-bottom:10px}
.flag b{display:block;margin-bottom:3px}.flag p{margin:0;font-size:13.5px;color:var(--ink2)}
.tag{display:inline-block;font-size:10px;font-weight:650;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--ink2);margin-left:8px;vertical-align:2px}
.note{font-size:12.5px;color:var(--muted);margin-top:12px;max-width:80ch}
nav{position:fixed;bottom:16px;right:18px;display:flex;gap:7px;align-items:center;z-index:9}
nav button{font:inherit;font-size:14px;width:32px;height:32px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.pnum{position:fixed;bottom:22px;left:22px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;z-index:9}
@media print{nav,.pnum{display:none}.slide{min-height:auto;height:190mm;padding:14mm;max-width:none}body{background:#fff}:root{--bg:#fff;--card:#fff;--ink:#000;--ink2:#333}@page{size:A4 landscape;margin:0}}
</style>
<div id="deck"></div>
<nav><button id="prev">←</button><span class="pnum" id="pn"></span><button id="next">→</button><button id="thm">◐</button></nav>

<script>
const D={"preparedBy":"Donna Graham","source":"Staff Costs & FTE Budget Model v2.1.xlsx","yearLabels":{"BY1":"2026/27","BY2":"2027/28","BY3":"2028/29"},"currentYear":{"outturn":4489137,"budget":4679896,"variance":-190759,"variancePct":-0.04076133232751343},"budgetYears":{"BY1":4870487,"BY2":5108281,"BY3":5343928},"threeYear":15322696,"standstill":{"outturn":4489137,"sameTeam":4731924,"budget":4870487},"byFunction":[{"name":"Customer Services","headcount":16,"fte":16,"outturn":502122,"by1":578434,"by2":636508,"by3":659557},{"name":"Sales","headcount":9,"fte":9,"outturn":288688,"by1":314037,"by2":355777,"by3":408967},{"name":"Support","headcount":32,"fte":29.6,"outturn":2536269,"by1":2711690,"by2":2810011,"by3":2919578},{"name":"Technology","headcount":25,"fte":25,"outturn":1157967,"by1":1266327,"by2":1305985,"by3":1355826}],"retrospective":{"components":[{"name":"Basic","budget":3214669.43,"actual":3159259.4},{"name":"Bonus","budget":476944.46,"actual":437154.54},{"name":"DC Pension","budget":189862.82,"actual":115239.48},{"name":"DB Pension","budget":134621.46,"actual":130700.4},{"name":"CA","budget":144000.0,"actual":143200.0},{"name":"NI","budget":519797.68,"actual":503583.24}],"budgetTotal":4679895.85,"actualTotal":4489137.06,"variance":-190758.79,"variancePct":-0.04076133232751343,"actualPeriods":[1,2,3,4,5,6,7,8,9],"forecastPeriods":[10,11,12]},"flags":[{"level":"watch","title":"Pension take-up may rise","body":"DC pension is budgeted at 8% but current take-up is 3.55%. Prudent to hold 8%, take-up can jump any time (a pay rise, turning 40, a nudge). Budgeting to 3.55% would leave no headroom if it does."},{"level":"watch","title":"Bonus at 75% achievement","body":"Budgeted at 75% corporate achievement. A full-achievement year is the single largest upside sensitivity. The assumption least within management control."},{"level":"watch","title":"Attrition and recruitment lag not costed","body":"Turnover rates are calculated but no vacancy saving, recruitment cost or backfill reaches any budget year. Vacancy gaps here are individually dated, not modelled."}],"totalFTE":79.6,"headcount":82};
const YL=D.yearLabels, m=v=>(v<0?"−":"")+"£"+Math.abs(Math.round(v)).toLocaleString("en-GB");
const mK=v=>(v<0?"−":"")+"£"+(Math.abs(v)>=1e6?(Math.abs(v)/1e6).toFixed(2)+"m":Math.round(Math.abs(v)/1000)+"k");
const sign=v=>(v>0?"+":"")+m(v);
const NS="http://www.w3.org/2000/svg";
const mk=(p,n,a,t)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;p.appendChild(e);return e;};
const cy=D.currentYear, by=D.budgetYears;

function slide(html){const s=document.createElement("section");s.className="slide";s.innerHTML=html;return s;}
const deck=document.getElementById("deck");

// 1 title
deck.append(slide(`<div class="eyebrow">Board of Directors · Budget approval</div>
  <h1>Workforce Budget<br>2026/27 – 2028/29</h1>
  <a href="../workshop/">Return to Workshop</a>
  <p class="lede">Three-year establishment plan, current-year outturn, and impact by function.
  All figures reconciled to ${D.source}.</p>
  <div class="note">Prepared by ${D.preparedBy}. Preview: committed baseline (no new scenarios locked yet).</div>`));

// 2 exec summary
deck.append(slide(`<div class="eyebrow">Executive summary</div>
  <h2>Where the workforce budget lands</h2>
  <div class="kpis">
    <div class="kpi"><div class="l">2025/26 outturn</div><div class="v">${mK(cy.outturn)}</div><div class="d neg">${sign(cy.variance)} vs budget (${(cy.variancePct*100).toFixed(1)}%)</div></div>
    <div class="kpi"><div class="l">2026/27 budget</div><div class="v">${mK(by.BY1)}</div><div class="d">${D.headcount} posts · ${D.totalFTE} FTE</div></div>
    <div class="kpi"><div class="l">2027/28</div><div class="v">${mK(by.BY2)}</div><div class="d pos">+${((by.BY2/by.BY1-1)*100).toFixed(1)}%</div></div>
    <div class="kpi"><div class="l">Three-year total</div><div class="v">${mK(D.threeYear)}</div><div class="d">to 2028/29</div></div>
  </div>
  <p><b>The current year came in ${(Math.abs(cy.variancePct*100)).toFixed(1)}% under budget</b>, an underspend driven mainly by
  pension take-up below the budgeted rate, not by cutting activity. <b>The 2026/27 budget of ${mK(by.BY1)}</b> holds the
  establishment and the pay award. The step to 2027/28 is largely the full-year effect of posts already approved.</p>`));

// 3 retrospective
{const r=D.retrospective;
 const s=slide(`<div class="eyebrow">Current year</div><h2>2025/26: how did we do?</h2>
   <p class="lede">Outturn ${m(r.actualTotal)} against a budget of ${m(r.budgetTotal)}, ${sign(r.variance)}, ${(Math.abs(r.variancePct*100)).toFixed(1)}% underspend.</p>
   <div id="retro"></div>
   <div class="callout warn"><b>An underspend is not automatically good news</b>
   The largest driver is pension take-up running below the budgeted 8%, prudent to keep budgeting 8%, since take-up can rise at any time.</div>`);
 deck.append(s);
 const g=mk(s.querySelector("#retro"),"svg",{viewBox:"0 0 900 240"});
 const comps=r.components,W=900,L=70,R=16,T=14,B=60,H=240;
 const max=Math.max(...comps.flatMap(c=>[c.budget,c.actual]))*1.1;
 const step=(W-L-R)/comps.length,bw=Math.min(26,step*.32),y=v=>H-B-(v/max)*(H-T-B);
 for(let k=0;k<=4;k++){const v=max*k/4;mk(g,"line",{x1:L,x2:W-R,y1:y(v),y2:y(v),class:"gl"});mk(g,"text",{x:L-7,y:y(v)+3.5,"text-anchor":"end",class:"t"},mK(v));}
 mk(g,"line",{x1:L,x2:W-R,y1:y(0),y2:y(0),class:"ax"});
 comps.forEach((c,i)=>{const cx=L+step*(i+.5);
   [[c.budget,"var(--s1)",-bw-1],[c.actual,"var(--s6)",1]].forEach(([v,col,off])=>mk(g,"rect",{x:cx+off,y:y(v),width:bw,height:Math.max(1,y(0)-y(v)),rx:3,fill:col,stroke:"var(--card)","stroke-width":1.5}));
   const d=c.actual-c.budget;mk(g,"text",{x:cx,y:y(Math.max(c.budget,c.actual))-6,"text-anchor":"middle",class:"v",fill:d<0?"var(--up)":"var(--crit)"},sign(d));
   mk(g,"text",{x:cx,y:H-B+16,"text-anchor":"middle",class:"t"},c.name.split(" ")[0]);
   if(c.name.includes(" "))mk(g,"text",{x:cx,y:H-B+28,"text-anchor":"middle",class:"t"},c.name.split(" ").slice(1).join(" "));});
}

// 4 standstill
{const s=D.standstill;
 const sl=slide(`<div class="eyebrow">Next year</div><h2>Outturn → Budget 2026/27</h2>
   <p class="lede">What next year costs, in two steps: the same establishment carried forward, then the pay award.</p>
   <div id="wf"></div>
   <div class="callout"><b>Standstill ${mK(s.sameTeam)}</b>
   is the same establishment next year with no pay rise. The rise to ${mK(s.budget)} is the pay award, the one controllable lever.
   For 2026/27 the award is the only rate increase; the employer-NI step falls in 2027/28.</div>`);
 deck.append(sl);
 const g=mk(sl.querySelector("#wf"),"svg",{viewBox:"0 0 900 260"});
 const bars=[["Outturn",s.outturn,"base"],["Establishment",s.sameTeam-s.outturn,"committed"],["Standstill",s.sameTeam,"mark"],["Pay award",s.budget-s.sameTeam,"control"],["Budget",s.budget,"base"]];
 const W=900,L=72,R=16,T=22,B=52,H=260,lo=Math.min(s.outturn,s.sameTeam)*.985,hi=s.budget*1.01;
 const y=v=>H-B-((v-lo)/(hi-lo))*(H-T-B),step=(W-L-R)/bars.length,bw=Math.min(96,step*.6);
 for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4;mk(g,"line",{x1:L,x2:W-R,y1:y(v),y2:y(v),class:"gl"});mk(g,"text",{x:L-8,y:y(v)+3.5,"text-anchor":"end",class:"t"},mK(v));}
 let acc=0;
 bars.forEach(([lab,val,type],i)=>{const cx=L+step*(i+.5);
   if(type==="base"||type==="mark"){const yv=y(val);mk(g,"rect",{x:cx-bw/2,y:yv,width:bw,height:Math.max(2,y(lo)-yv),rx:4,fill:type==="mark"?"none":"var(--s1)",stroke:type==="mark"?"var(--axis)":"var(--card)","stroke-width":type==="mark"?1.5:2,"stroke-dasharray":type==="mark"?"4 3":"0","fill-opacity":type==="mark"?0:1});mk(g,"text",{x:cx,y:yv-8,"text-anchor":"middle",class:"v"},mK(val));acc=val;}
   else{const from=acc,to=acc+val;acc=to;const yv=Math.min(y(from),y(to));mk(g,"rect",{x:cx-bw/2,y:yv,width:bw,height:Math.max(2,Math.abs(y(to)-y(from))),rx:3,fill:type==="control"?"var(--s1)":"var(--committed)",stroke:"var(--card)","stroke-width":2});mk(g,"text",{x:cx,y:yv-8,"text-anchor":"middle",class:"v"},(val>0?"+":"")+mK(val));}
   mk(g,"text",{x:cx,y:H-B+18,"text-anchor":"middle",class:"t"},lab);});
 mk(g,"line",{x1:L,x2:W-R,y1:y(lo),y2:y(lo),class:"ax"});
}

// 5 trajectory
{const sl=slide(`<div class="eyebrow">Trajectory</div><h2>Three-year view</h2>
   <div id="traj"></div>
   <table><thead><tr><th>Year</th><th>Cost</th><th>Change</th></tr></thead><tbody>
   <tr><td>2025/26 outturn</td><td>${m(cy.outturn)}</td><td>n/a</td></tr>
   ${["BY1","BY2","BY3"].map((yy,i,arr)=>{const prev=i===0?cy.outturn:by[arr[i-1]];return `<tr><td>${YL[yy]}</td><td>${m(by[yy])}</td><td>${((by[yy]/prev-1)*100>=0?"+":"")+((by[yy]/prev-1)*100).toFixed(1)}%</td></tr>`;}).join("")}
   </tbody><tfoot><tr><td>Three-year total</td><td>${m(D.threeYear)}</td><td>n/a</td></tr></tfoot></table>`);
 deck.append(sl);
 const g=mk(sl.querySelector("#traj"),"svg",{viewBox:"0 0 900 220"});
 const pts=[["25/26",cy.outturn],["26/27",by.BY1],["27/28",by.BY2],["28/29",by.BY3]];
 const W=900,L=70,R=16,T=18,B=34,H=220,max=Math.max(...pts.map(p=>p[1]))*1.12;
 const step=(W-L-R)/pts.length,bw=Math.min(90,step*.5),y=v=>H-B-(v/max)*(H-T-B);
 for(let k=0;k<=4;k++){const v=max*k/4;mk(g,"line",{x1:L,x2:W-R,y1:y(v),y2:y(v),class:"gl"});mk(g,"text",{x:L-7,y:y(v)+3.5,"text-anchor":"end",class:"t"},mK(v));}
 pts.forEach(([lab,v],i)=>{const cx=L+step*(i+.5);mk(g,"rect",{x:cx-bw/2,y:y(v),width:bw,height:Math.max(1,y(0)-y(v)),rx:4,fill:i===0?"var(--committed)":"var(--s1)",stroke:"var(--card)","stroke-width":2});mk(g,"text",{x:cx,y:y(v)-7,"text-anchor":"middle",class:"v"},mK(v));mk(g,"text",{x:cx,y:H-12,"text-anchor":"middle",class:"t"},lab);});
 mk(g,"line",{x1:L,x2:W-R,y1:y(0),y2:y(0),class:"ax"});
}

// 6 by function
{const rows=D.byFunction;
 deck.append(slide(`<div class="eyebrow">Structure</div><h2>Impact by function</h2>
   <p class="lede">Each function's outturn, budget and three-year path. Recognisable to the executive who owns it.</p>
   <table><thead><tr><th>Function</th><th>HC</th><th>FTE</th><th>Outturn 25/26</th><th>Budget 26/27</th><th>27/28</th><th>28/29</th></tr></thead><tbody>
   ${rows.map(f=>`<tr><td>${f.name}</td><td>${f.headcount}</td><td>${f.fte}</td><td>${m(f.outturn)}</td><td>${m(f.by1)}</td><td>${m(f.by2)}</td><td>${m(f.by3)}</td></tr>`).join("")}
   </tbody><tfoot><tr><td>Total</td><td>${D.headcount}</td><td>${D.totalFTE}</td><td>${m(cy.outturn)}</td><td>${m(by.BY1)}</td><td>${m(by.BY2)}</td><td>${m(by.BY3)}</td></tr></tfoot></table>
   <p class="note">Full department-level detail and every post's status is available in the C-suite analysis pack.</p>`));
}

// 7 concerns
deck.append(slide(`<div class="eyebrow">Governance</div><h2>Matters for the board's attention</h2>
  ${D.flags.map(f=>`<div class="flag"><b>${f.title}<span class="tag">watch</span></b><p>${f.body}</p></div>`).join("")}`));

// 8 basis
deck.append(slide(`<div class="eyebrow">Appendix</div><h2>Basis of preparation</h2>
  <ul>
  <li><b>Source.</b> ${D.source}, ${D.headcount} positions. Every figure reconciled to the workbook: FTE by cost centre and month, and all position-years tie exactly.</li>
  <li><b>Assumptions.</b> Pay award 3% each year. DC pension 8%, DB 16%. Employer NI on the secondary-threshold basis. Bonus at 75% corporate achievement.</li>
  <li><b>Current-year pension</b> take-up runs below the budgeted rate; the budget holds 8% prudently.</li>
  <li><b>Not yet modelled:</b> the maternity SMP HMRC rebate, and attrition/recruitment-lag costs. See the analysis pack.</li>
  <li><b>Preview.</b> Locked to the committed baseline; the final pack locks to the C-suite's agreed scenario.</li>
  </ul>`));

// nav
const S=[...deck.children];let i=0;
const go=n=>{i=Math.max(0,Math.min(S.length-1,n));S[i].scrollIntoView({behavior:"smooth"});sync();};
function sync(){document.getElementById("pn").textContent=`${i+1} / ${S.length}`;}
document.getElementById("next").onclick=()=>go(i+1);
document.getElementById("prev").onclick=()=>go(i-1);
document.getElementById("thm").onclick=()=>{const d=document.documentElement;const dark=getComputedStyle(d).getPropertyValue("--bg").trim()==="#0d0d0d";d.setAttribute("data-theme",dark?"light":"dark");};
addEventListener("keydown",e=>{if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();go(i+1);}if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(i-1);}if(e.key==="Home")go(0);if(e.key==="End")go(S.length-1);});
S.forEach(s=>new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){i=S.indexOf(e.target);sync();}}),{threshold:.55}).observe(s));
sync();
</script>
